name: Update README Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: readme-maintenance
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update README timestamp
        shell: bash
        run: |
          set -euo pipefail
          date_value="$(date -u +"%Y-%m-%d")"
          timestamp_line="Last updated: ${date_value}"

          if grep -q "^Last updated:" README.md; then
            sed -i "s/^Last updated:.*/${timestamp_line}/" README.md
          else
            printf "\\n%s\\n" "$timestamp_line" >> README.md
          fi

      - name: Commit and push when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brajesh Kumar"
          git config user.email "90491106+Brajesh31@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README timestamp is already current."
            exit 0
          fi

          git commit -m "chore: update README timestamp"
          git push origin HEAD:main
